<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Painel no celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F5F1}
a{color:#1F4A3C}a:hover{color:#143327}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #1D1C1A; background: #F6F5F1; display: flex; flex-direction: column; overflow: hidden">
<div style="flex: 1; min-height: 0; padding: 24px 20px 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
<header style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 26px; font-weight: 600">Painel</h1>
<span style="font-size: 13px; color: #5E5B55">Faltam 153 dias</span>
</div>
<svg width="30" height="30" viewBox="0 0 28 28" fill="none" stroke="#2E5E4E" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="14" r="7"></circle><circle cx="17" cy="14" r="7"></circle></svg>
</header>
<section style="background: #2E5E4E; color: #FFFFFF; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; color: #DCEAE2">Disponível</span>
<span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 32px; font-weight: 600">R$ 18.130</span>
<div role="img" aria-label="Pago 21%, a pagar 49%, disponível 30%" style="display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: #4F7D6C"><div style="width: 21%; background: #FFFFFF"></div><div style="width: 49%; background: #A9C9BA"></div></div>
<span style="font-size: 13px; color: #DCEAE2">Pago R$ 12.430 · Previsto R$ 41.870 · Total R$ 60.000</span>
</section>
<a href="Busca.dc.html" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #D9D5CB; text-decoration: none; color: #5E5B55; font-size: 15px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg>Buscar preço de um produto</a>
<a href="Itens.dc.html" style="display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 12px; background: #FBEDE2; text-decoration: none; color: #7A300A; font-size: 14px; font-weight: 600">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3l9.5 17h-19z"></path><path d="M12 10v4M12 17.5h.01"></path></svg>Quarto passou do limite em R$ 800</a>
<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">Por cômodo</h2>
<sc-for list="{{rooms}}" as="r" hint-placeholder-count="4">
<a href="Itens.dc.html" style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E3E0D8; text-decoration: none; color: #1D1C1A">
<div style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-weight: 600">{{r.name}}</span><span style="color: #3D3A35">{{r.planned}} de {{r.limit}}</span></div>
<div style="height: 6px; border-radius: 999px; background: #ECEAE4; overflow: hidden"><div style="height: 6px; width: {{r.bar}}; background: {{r.color}}"></div></div>
</a>
</sc-for>
</section>
</div>
<nav aria-label="Menu principal" style="flex: none; height: 72px; background: #FFFFFF; border-top: 1px solid #E3E0D8; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
<a href="Mobile.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #1F4A3C; font-size: 12px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>Painel</a>
<a href="Itens.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E5B55; font-size: 12px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"></path><path d="M4 6h.01M4 12h.01M4 18h.01"></path></svg>Itens</a>
<a href="Busca.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E5B55; font-size: 12px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg>Buscar</a>
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E5B55; font-size: 12px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>Ajustes</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var rooms = [
      { name: 'Cozinha', planned: 'R$ 14.200', limit: 'R$ 15.000', p: 95 },
      { name: 'Quarto', planned: 'R$ 9.800', limit: 'R$ 9.000', p: 109 },
      { name: 'Sala', planned: 'R$ 6.450', limit: 'R$ 10.000', p: 65 },
      { name: 'Área de serviço', planned: 'R$ 4.300', limit: 'R$ 6.000', p: 72 }
    ].map(function (r) {
      return Object.assign({}, r, { bar: Math.min(r.p, 100) + '%', color: r.p > 100 ? '#B4541A' : (r.p >= 90 ? '#C98A2E' : '#2E5E4E') });
    });
    return { rooms: rooms };
  }
}
</script>
</body>
</html>
